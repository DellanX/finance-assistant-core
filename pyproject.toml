[project]
name = "finance-assistant-backend"
version = "0.1.0"
description = "Backend for Finance Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pydantic>=2.0",
    "pydantic-settings",
    "ruamel.yaml",
    "jinja2"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "mypy",
    "ruff"
]
