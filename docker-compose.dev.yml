version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/app/app
      - ./pyproject.toml:/app/pyproject.toml
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./finance.db
      - ENVIRONMENT=dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - frontend

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend-dev:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

